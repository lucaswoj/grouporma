<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#F47A2A"/>
      <stop offset="0.55" stop-color="#DE4818"/>
      <stop offset="1"    stop-color="#A0210C"/>
    </linearGradient>
    <linearGradient id="peakLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E2E2"/>
    </linearGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle halo behind the north star -->
  <circle cx="780" cy="290" r="170" fill="url(#starGlow)"/>

  <!-- North star (4-point) -->
  <g transform="translate(780 290)">
    <path d="M 0 -95 L 20 -20 L 95 0 L 20 20 L 0 95 L -20 20 L -95 0 L -20 -20 Z"
          fill="#FFFFFF"/>
    <path d="M 0 -46 L 10 -10 L 46 0 L 10 10 L 0 46 L -10 10 L -46 0 L -10 -10 Z"
          fill="#FFE4C2" opacity="0.9"/>
  </g>

  <!-- Far ridge -->
  <path d="M -20 800 L 140 640 L 320 740 L 520 620 L 720 720 L 900 660 L 1044 720 L 1044 1044 L -20 1044 Z"
        fill="url(#ridgeBack)"/>

  <!-- Main mountain (asymmetric, two summits) -->
  <path d="M 40 940
           L 340 470
           L 470 620
           L 620 280
           L 770 540
           L 880 470
           L 1000 940 Z"
        fill="url(#peakLight)"/>

  <!-- Shadow on right faces -->
  <path d="M 620 280 L 770 540 L 710 540 L 620 360 Z" fill="#000000" fill-opacity="0.18"/>
  <path d="M 340 470 L 470 620 L 425 620 L 340 540 Z" fill="#000000" fill-opacity="0.14"/>
  <path d="M 880 470 L 1000 940 L 910 940 L 880 590 Z" fill="#000000" fill-opacity="0.12"/>

  <!-- Soft snow-line shadow on main peak left face -->
  <path d="M 620 280 L 560 430 L 500 560 L 470 620 L 440 620 L 540 430 L 605 320 Z"
        fill="#000000" fill-opacity="0.05"/>
</svg>
